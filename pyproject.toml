# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
# Tooling configuration only - this repository is not a Python package.

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]
ignore = [
  "E501",   # long strings in translations/log messages; ruff format handles code
  "SIM105", # contextlib.suppress is not clearer for single except blocks
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/storage_manager"]
show_error_codes = true

[tool.pytest.ini_options]
# pytest-homeassistant-custom-component ships async fixtures; auto mode resolves them
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["custom_components/storage_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
