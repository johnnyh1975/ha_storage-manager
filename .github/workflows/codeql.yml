# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
name: CodeQL

# Separate from validate.yml so the analysis does not slow down the fast
# feedback loop. The integration deletes files and edits configuration.yaml,
# which is exactly the kind of code a static security scan should look at.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Scan what ships and its sources, not tests or the minified bundle.
          config: |
            paths-ignore:
              - tests
              - frontend/node_modules
              - custom_components/storage_manager/frontend
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
