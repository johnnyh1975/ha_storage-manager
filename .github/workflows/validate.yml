# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (HA 2026.10 / Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install "uv==0.12.18"
      - name: Install pinned test tooling
        run: uv pip install --system -r requirements_test.txt
      - name: Run full test suite with coverage
        env:
          COVERAGE_CORE: sysmon
        run: |
          python -m pytest tests/ -q -p no:randomly \
            --cov=custom_components/storage_manager --cov-branch \
            --cov-report=term-missing --cov-report=xml
      - name: Check 95 % line coverage in every module
        run: python scripts/check_coverage_per_module.py coverage.xml --min 95
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff (pinned in requirements_test.txt)
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  typing:
    name: Typing (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install "uv==0.12.18"
      - name: Install pinned tooling
        run: uv pip install --system -r requirements_test.txt
      - name: Run mypy
        run: mypy

  translations:
    name: Translation Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check strings.json, translations/*.json and panel dictionaries
        run: python3 scripts/check_translations.py

  private-data:
    name: No Private Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the lines this change adds
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD"
          fi
          python3 scripts/check_private_data.py --base "$BASE"

  consistency:
    name: Versions and Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check versions agree and relative links resolve
        run: python3 scripts/check_consistency.py

  panel:
    name: Panel Build Is Committed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build panel
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Built bundle matches the sources
        run: git diff --exit-code -- custom_components/storage_manager/frontend/
