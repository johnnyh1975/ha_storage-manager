# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/storage_manager/manifest.json'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "manifest version ${version} != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Zip integration
        run: cd custom_components/storage_manager && zip -r ../../storage_manager.zip .
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" storage_manager.zip \
            --title "Storage Manager ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
