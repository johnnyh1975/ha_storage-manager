# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
#
# Creates a GitHub release (tag v<version>) whenever the version in
# manifest.json changes on main and no release for it exists yet.
name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/storage_manager/manifest.json
      - .github/workflows/release.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/storage_manager/manifest.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Zip integration
        if: steps.exists.outputs.exists == 'false'
        run: cd custom_components/storage_manager && zip -r ../../storage_manager.zip .
      - name: Release notes from CHANGELOG
        if: steps.exists.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" storage_manager.zip \
            --target "${GITHUB_SHA}" \
            --title "Storage Manager ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
