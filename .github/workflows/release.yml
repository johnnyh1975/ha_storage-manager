# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package and release (e.g. v0.2.0). The tag is created on the selected branch if it does not exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse a tag that does not match the checked-out code
        run: |
          HAVE=$(python3 -c "import json;print(json.load(open('custom_components/storage_manager/manifest.json'))['version'])")
          WANT="${{ steps.version.outputs.version }}"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} would be cut against manifest version ${HAVE}."
            echo "::error::Select the branch holding ${WANT}, or bump manifest.json first."
            exit 1
          fi
          python3 scripts/check_consistency.py

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install "uv==0.12.18"
      - name: Install pinned test tooling
        run: uv pip install --system -r requirements_test.txt
      - name: Run full test suite (release gate - must pass before packaging)
        run: |
          python -m pytest tests/ -q -p no:randomly \
            --cov=custom_components/storage_manager --cov-report=xml
          python scripts/check_coverage_per_module.py coverage.xml --min 95

      - name: Prepare release notes
        id: notes
        run: |
          NOTES="release-notes/${{ steps.version.outputs.tag }}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing. Commit it before releasing."
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Build HACS-install ZIP
        run: |
          cd custom_components/storage_manager
          zip -r "${GITHUB_WORKSPACE}/storage_manager.zip" . -x "*__pycache__*"

      - name: Validate ZIP structure
        run: |
          FILES=$(unzip -Z1 storage_manager.zip)
          echo "$FILES" | grep -qx "manifest.json" || { echo "::error::manifest.json is not at the ZIP root"; exit 1; }
          echo "$FILES" | grep -qx "frontend/storage-manager-panel.js" || { echo "::error::panel bundle missing"; exit 1; }
          if echo "$FILES" | grep -q "custom_components"; then
            echo "::error::ZIP contains a custom_components/ wrapper"; exit 1
          fi
          if echo "$FILES" | grep -qx "hacs.json"; then
            echo "::error::hacs.json must not be inside the ZIP"; exit 1
          fi
          echo "ZIP structure OK"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "${{ steps.version.outputs.tag }}" storage_manager.zip \
            --target "${GITHUB_SHA}" \
            --title "Storage Manager ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.path }}" $FLAGS
